<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Your Secret — Anonymous Stories</title>
    <meta name="description" content="Share anonymous stories and read what others have posted. A simple local-storage based anonymous story feed.">
    <meta property="og:title" content="Share Your Secret — Anonymous Stories">
    <meta property="og:description" content="Share anonymous stories and read what others have posted.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕶️</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>
        <h1>Anonymous Stories</h1>
        <p>A safe space for untold words</p>
    </header>

    <main id="main-content" class="container">
        <section class="story-form" aria-labelledby="form-heading">
            <h2 id="form-heading">Share your story</h2>
            <label for="storyContent" class="sr-only">Write your anonymous story here</label>
            <textarea id="storyContent" placeholder="Write what's on your mind... everything stays between you and the page." rows="6"></textarea>
            <button id="submitStory" type="button">Submit</button>
        </section>

        <section class="story-list" aria-labelledby="feed-heading">
            <h2 id="feed-heading">Stories</h2>
            <div id="storyFeed">
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
